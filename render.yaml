services:
  - type: web
    name: bookswap-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
    healthCheckPath: /health
    autoDeploy: true

  - type: web
    name: bookswap-web
    runtime: docker
    dockerfilePath: ./Dockerfile.web
    envVars:
      - key: PORT
        value: 10000
    autoDeploy: true
